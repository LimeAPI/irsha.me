<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Irsha Global</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#f1efe8">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1efe8;--ink:#191a18;--muted:#686961;--line:#d5d2c8;--blue:#454dff;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);display:grid;place-items:center;padding:clamp(24px,6vw,80px);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}
.shell{width:min(100%,980px);border-top:1px solid var(--line);padding-top:34px}
.eyebrow{font:11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.eyebrow:before{content:'';width:7px;height:7px;background:var(--blue);border-radius:50%}
h1{font:clamp(74px,17vw,190px)/.82 var(--serif);font-weight:400;letter-spacing:-.055em;margin:26px 0 0}
h1 em{font-style:italic;color:var(--blue)}
p{font-size:clamp(15px,1.6vw,18px);line-height:1.7;color:#55564f;max-width:420px;margin:26px 0 32px}
.btn{display:inline-flex;align-items:center;gap:20px;padding:15px 18px;font-size:12px;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:var(--paper);transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--blue);border-color:var(--blue);transform:translateY(-2px)}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:clamp(50px,9vw,90px);padding-top:22px;border-top:1px solid var(--line);font:10px/1.7 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot a:hover{color:var(--blue)}
</style>
</head>
<body>
<main class="shell">
<div class="eyebrow">Error 404 / Page not found</div>
<h1>Wrong <em>turn.</em></h1>
<p>This page has moved, never existed, or is still an idea waiting to be built. Let’s get you back to the work that does exist.</p>
<a class="btn" href="/">Back to irsha.me <span aria-hidden="true">↗</span></a>
<div class="foot">
  <span>Irsha Global — independent venture studio</span>

</div>
</main>
</body>
</html>
